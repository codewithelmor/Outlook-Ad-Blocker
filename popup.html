<!doctype html>
<html><head><meta charset="utf-8"><title>Clean Outlook</title>
<style>
  body { font: 14px system-ui, sans-serif; width: 260px; margin: 12px; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  label { display: flex; gap: 8px; align-items: center; padding: 4px 0; }
  small { color: #666; }
</style></head>
<body>
  <h1>Clean Outlook</h1>
  <label><input type="checkbox" data-k="listAds"> Sponsored email in list</label>
  <label><input type="checkbox" data-k="sidebar"> Right sidebar ad</label>
  <label><input type="checkbox" data-k="banners"> Upgrade &amp; bottom banners</label>
  <label><input type="checkbox" data-k="upsell"> "Buy Microsoft 365" button</label>
  <small>Changes apply immediately. <span id="count"></span></small>
  <script src="popup.js"></script>
</body></html>
